version: '3.8'
services:
  bowpanel-main:
    build: .
    container_name: bowpanel-main
    restart: unless-stopped
    ports:
      - "6767:6767"
      - "6868:6868"
    environment:
      - NODE_ENV=production
      - PORT=6767
      - ENABLE_DOCKER=true
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
      - BowPanel_HOST_DATA_PATH=${PWD}/.data
      - BowPanel_OWNER_USER=${JTG_OWNER_USER:-}
      - BowPanel_OWNER_PASS=${JTG_OWNER_PASS:-}
    volumes:
      - ./.data:/app/.data
      - ./backups:/app/backups
      - /var/run/docker.sock:/var/run/docker.sock

  bowpanel-admin:
    build: .
    container_name: bowpanel-admin
    restart: unless-stopped
    command: npm run dev
    ports:
      - "3000:3000"
      - "6869:6869"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - ENABLE_DOCKER=true
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
      - JTG_HOST_DATA_PATH=${PWD}/.data
      - JTG_OWNER_USER=${JTG_OWNER_USER:-}
      - JTG_OWNER_PASS=${JTG_OWNER_PASS:-}
    volumes:
      - ./.data:/app/.data
      - ./backups:/app/backups
      - /var/run/docker.sock:/var/run/docker.sock
